<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19-text</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        .caja-texto {
            width: 360px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .alineacion {
            text-align: center; /* left | right | center | justify */
            text-transform: uppercase; /* lowercase | capitalize | none */
            text-decoration: underline; /* overline | line-through | none */
        }

        .espaciado {
            line-height: 2; /* Altura entre lineas */
            letter-spacing: 3px; /* Espacio entre letras */
            word-spacing: 10px; /* Espacio entre palabras */
            text-indent: 50px; /* Sangría primera línea */
        }
    </style>
</head>
<body class="css">

            <ul>
                <li>Align</li>
                <li>Line Height</li>
                <li>Decoration</li>
                <li>Transform</li>
                <li>Indent</li>
                <li>Spacing (word/letter)</li>
            </ul>
        </header>
        <section>
            <div class="caja-texto">
        <p class="alineacion">
            Texto alineado al centro, mayúsculas y subrayado.
        </p>
        
        <p class="espaciado">
            Este párrafo tiene mucho espacio. La primera línea está indentada. 
            El espacio entre letras es amplio y entre palabras también.
        </p>
    </div>
        </section>
    </main>
